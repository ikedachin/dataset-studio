[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-studio"
version = "0.1.0"
description = "A safe, schema-agnostic JSONL dataset editor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "datasets>=3.0",
  "fastapi>=0.115",
  "huggingface-hub>=0.27",
  "jinja2>=3.1",
  "platformdirs>=4.3",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "mypy>=1.14", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]

[project.scripts]
dataset-studio = "dataset_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_studio"]

[tool.hatch.build]
artifacts = ["src/dataset_studio/static/**"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.14", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
