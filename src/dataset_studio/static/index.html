    <script>
      // Set the selected language before the page body or application loads.
      (() => {
        let language = navigator.language.toLowerCase().startsWith("ja") ? "ja" : "en";
        try {
          const saved = localStorage.getItem("dataset-studio-language");
          if (saved === "ja" || saved === "en") language = saved;
        } catch {
          // Use the browser language when storage is unavailable.
        }
        document.documentElement.lang = language;
      })();
    </script>
